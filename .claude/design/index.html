<div class="topbar"><span class="store">BN</span><b>Your store</b><span style="color:#8A8A8A">/ Apps / FitFinder</span><label class="theme-pick"><span>Theme</span><select id="theme-select" aria-label="Colour theme"><option value="graphite">Graphite</option><option value="indigo">Indigo & teal</option><option value="emerald">Emerald</option><option value="plum">Plum & rose</option><option value="sunset">Sunset (orange)</option><option value="golden">Golden (yellow)</option><option value="coral">Coral & pink</option><option value="crimson">Crimson & rose</option><option value="teal">Teal & cyan</option><option value="sky">Sky (light blue)</option><option value="ocean">Blue & violet (previous)</option></select></label><span class="proto">Prototype · sample data</span></div>
<nav class="mnav" id="mnav" aria-label="FitFinder"></nav>
<div class="shell">
  <aside class="side" id="side">
    <p class="apps">Apps</p>
    <div class="app"><span class="tile" style="background:linear-gradient(135deg,var(--p),var(--a))"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg></span>FitFinder</div>
    <nav id="nav" aria-label="FitFinder" style="display:flex;flex-direction:column;gap:2px"></nav>
  </aside>
  <main id="view"></main>
</div>
