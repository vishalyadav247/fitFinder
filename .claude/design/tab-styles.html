<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab styles</title>
<style>
  :root {
    --p: #0284c7; --p-strong: #075985; --p-soft: #e0f2fe; --a: #6366f1;
    --text: #303030; --muted: #616161; --line: #e3e3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px;
    font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #f0f9ff 0, #f1f1f1 360px) no-repeat, #f1f1f1;
  }
  main { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }
  h1 { font-size: 20px; margin: 0; }
  .intro { margin: 4px 0 0; color: var(--muted); }
  .opt { display: grid; gap: 10px; }
  .opt h2 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .opt h2 span { font-weight: 500; color: var(--muted); font-size: 13px; }
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 14px; }
  .frame { padding: 20px; border-radius: 14px; background: rgba(255,255,255,.35); border: 1px dashed #cfd6dd; }
  .card { margin-top: 14px; background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -8px rgba(2,132,199,.16); }
  .card .row { height: 10px; border-radius: 5px; background: #eef0f2; margin: 10px 0; }
  .card .row:nth-child(2n) { width: 82%; } .card .row:nth-child(3n) { width: 64%; }
  .ico { width: 16px; height: 16px; flex: 0 0 16px; }
  .n { font-size: 11.5px; font-weight: 700; line-height: 18px; padding: 0 7px; border-radius: 999px; }
  button { font: inherit; cursor: pointer; }

  /* 1. Polaris native */
  .t1 { display: flex; gap: 4px; }
  .t1 button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
    padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 550; font-size: 13px; }
  .t1 button:hover { background: rgba(0,0,0,.05); color: var(--text); }
  .t1 button.on { background: rgba(0,0,0,.08); color: #1a1a1a; font-weight: 650; }
  .t1 .n { background: rgba(0,0,0,.07); color: #4a4a4a; }

  /* 2. Underline, sliding */
  .t2 { position: relative; display: flex; gap: 24px; border-bottom: 1px solid #dcdfe3; }
  .t2 button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent;
    padding: 10px 0 12px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .t2 button:hover { color: var(--text); }
  .t2 button.on { color: var(--p-strong); }
  .t2 .bar { position: absolute; bottom: -1px; height: 2px; background: var(--p); border-radius: 2px;
    transition: left .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1); }
  .t2 .n { background: #eef0f2; color: #4a4a4a; }
  .t2 button.on .n { background: var(--p-soft); color: var(--p-strong); }

  /* 3. iOS segmented */
  .t3 { position: relative; display: inline-flex; padding: 3px; border-radius: 10px; background: #e6e8eb; }
  .t3 button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 150px; border: 0; background: transparent; padding: 7px 16px; border-radius: 8px;
    color: #4a4f57; font-weight: 600; font-size: 13px; }
  .t3 button.on { color: #111; }
  .t3 .bar { position: absolute; top: 3px; bottom: 3px; background: #fff; border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.08);
    transition: left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1); }
  .t3 .n { background: rgba(0,0,0,.07); color: #4a4a4a; }

  /* 4. Soft tinted pills */
  .t4 { display: flex; gap: 8px; }
  .t4 button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #dfe3e8; background: #fff;
    padding: 8px 16px; border-radius: 999px; color: #4a4f57; font-weight: 600; font-size: 13px;
    transition: all .18s ease; }
  .t4 button:hover { border-color: #c4ccd6; color: var(--text); }
  .t4 button.on { background: var(--p-soft); border-color: #bae6fd; color: var(--p-strong); }
  .t4 .n { background: #f1f3f5; color: #4a4a4a; }
  .t4 button.on .n { background: #fff; color: var(--p-strong); }

  /* 5. Folder tabs attached to the card */
  .t5 { display: flex; gap: 4px; padding-left: 8px; }
  .t5 button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent;
    padding: 10px 18px; border-radius: 10px 10px 0 0; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .t5 button:hover { background: rgba(255,255,255,.6); color: var(--text); }
  .t5 button.on { background: #fff; color: #111; box-shadow: 0 -1px 2px rgba(15,23,42,.05); }
  .t5 + .card { margin-top: 0; border-top-left-radius: 0; }
  .t5 .n { background: #eef0f2; color: #4a4a4a; }
  .t5 button.on .n { background: var(--p-soft); color: var(--p-strong); }

  /* 6. Big cards (Linear / Notion-style) */
  .t6 { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 10px; }
  .t6 button { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid #e3e6ea; background: #fff;
    padding: 12px 14px; border-radius: 12px; color: var(--text); transition: all .18s ease; }
  .t6 button:hover { border-color: #c9d1da; }
  .t6 button.on { border-color: var(--p); box-shadow: 0 0 0 3px rgba(2,132,199,.12); }
  .t6 .tile { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #f1f3f5; color: #5c6370; }
  .t6 button.on .tile { background: var(--p-soft); color: var(--p-strong); }
  .t6 b { display: block; font-size: 13.5px; } .t6 small { color: var(--muted); font-size: 12px; }

  @media (max-width: 600px) { .t3 button { min-width: 0; } .t6 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>Tab styles for SpareFit</h1>
    <p class="intro">Click the tabs to try them. Pick a number and it goes on Filter data first, then the whole app.</p>
  </div>
</main>

<template id="icons">
  <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5h12M4 10h12M4 15h12"/></svg>
  <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13V4M6.5 7.5 10 4l3.5 3.5M4 13v2.5h12V13"/></svg>
</template>

<script>
  const OPTIONS = [
    ["t1", "1 · Shopify native", "the admin's own tab look (Orders: All / Unfulfilled …): quiet, familiar"],
    ["t2", "2 · Underline that slides", "Stripe / GitHub: a thin line under the active tab glides between tabs"],
    ["t3", "3 · iOS segmented control", "a grey track with a raised white pill that slides"],
    ["t4", "4 · Soft pills", "separate rounded chips; the active one light blue"],
    ["t5", "5 · Folder tabs", "the active tab joins the card below it, like a file folder"],
    ["t6", "6 · Option cards", "Linear / Notion: each tab a small card with an icon and a line of help"],
  ];
  const TABS = [
    { label: "Filter data", n: "12,480", help: "Browse, edit and export rows" },
    { label: "Import CSV", help: "Upload a file and see past imports" },
  ];
  const icons = [...document.getElementById("icons").content.children];
  const main = document.querySelector("main");

  for (const [cls, title, note] of OPTIONS) {
    const sec = document.createElement("section");
    sec.className = "opt";
    sec.innerHTML = `<h2>${title} <span>${note}</span></h2><div class="frame"><p class="page-title">Filter data</p><div class="${cls}" role="tablist"></div><div class="card"><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div></div>`;
    main.append(sec);
    const bar = sec.querySelector("." + cls);
    const sliding = cls === "t2" || cls === "t3";
    const ind = sliding ? Object.assign(document.createElement("span"), { className: "bar" }) : null;
    if (ind) bar.append(ind);
    TABS.forEach((t, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      const ico = icons[i].outerHTML;
      b.innerHTML = cls === "t6"
        ? `<span class="tile">${ico}</span><span><b>${t.label}</b><small>${t.help}</small></span>`
        : `${ico}${t.label}${t.n ? `<span class="n">${t.n}</span>` : ""}`;
      b.onclick = () => select(i);
      bar.append(b);
    });
    const select = (i) => {
      [...bar.querySelectorAll("button")].forEach((b, j) => {
        b.classList.toggle("on", i === j);
        b.setAttribute("aria-selected", i === j);
      });
      if (ind) {
        const on = bar.querySelectorAll("button")[i];
        ind.style.left = on.offsetLeft + "px";
        ind.style.width = on.offsetWidth + "px";
      }
    };
    requestAnimationFrame(() => select(0));
  }
</script>
</body>
</html>
