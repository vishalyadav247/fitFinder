# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7b77c7efd0009a88cfc875d912e97bf9"
application_url = "https://example.com"
embedded = true
name = "fitFinder"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: SKU and handle linking (M6). write_app_proxy: the storefront app proxy (M7).
# Theme scopes are added in M8 once verified.
scopes = "read_products,write_app_proxy"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Product mapping (M6): keep the catalog cache and product links fresh.
  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

# Storefront data for the theme app extension (M7): /apps/fitfinder/* → {app url}/proxy/*.
# Merchants can rename the prefix/subpath in their admin; the storefront uses /apps/fitfinder.
# https://shopify.dev/docs/apps/build/online-store/app-proxies
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "fitfinder"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
