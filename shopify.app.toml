# PRODUCTION app. The development app lives in shopify.app.dev.toml.
# The deploy:prod and info:prod npm scripts use this file; `npm run config:prod` makes it the CLI
# default. Replace every REPLACE_WITH_… value first: the production scripts refuse to run while
# one is left (scripts/app-config.mjs).
# Keep the sections below in step with shopify.app.dev.toml (same scopes, webhooks and
# app proxy); only client_id, name, handle and the URLs differ. `npm run config:check` compares.
# Learn more: https://shopify.dev/docs/apps/build/cli-for-apps/manage-app-config-files

client_id = "4e332d3b6e466789e591acaa2d44d399"
application_url = "https://sparefit.progryss.com"
embedded = true
name = "SpareFit – Parts Finder"
# Must be the production app's handle (Dev Dashboard). The production env's SHOPIFY_APP_HANDLE
# must be the same value (billing return URL).
handle = "sparefit"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: SKU and handle linking (M6). write_app_proxy: the storefront app proxy (M7).
# read_themes: theme integration status (M8). write_files: My Selection custom icon (M8).
scopes = "read_products,write_app_proxy,read_themes,write_files"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Billing API charges (agreed 2026-10-13): approved, declined, cancelled, frozen, expired.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory compliance webhooks (M10). https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  # Product mapping (M6): keep the catalog cache and product links fresh.
  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

# Storefront data for the theme app extension (M7): /apps/sparefit/* → {app url}/proxy/*.
# Merchants can rename the prefix/subpath in their admin; the storefront uses /apps/sparefit.
# https://shopify.dev/docs/apps/build/online-store/app-proxies
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "sparefit"

[auth]
redirect_urls = [ "https://sparefit.progryss.com/api/auth" ]

[build]
# Never let `shopify app dev` point the production app at a dev tunnel.
automatically_update_urls_on_dev = false
